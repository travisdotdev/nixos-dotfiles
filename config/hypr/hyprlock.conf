$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 5
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(667a82aa)
    check_color = rgba(8daf9baa)
    fail_color = rgba(c76d76aa)
    font_color = rgb(170, 188, 193)
    fade_on_empty = false
    rounding = 25
    font_family = $font
    placeholder_text =
    fail_text = $PAMFAIL
    dots_size = 0.2
    dots_spacing = 0.3
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(879ca1ff)
    font_size = 70
    font_family = Iosevka Nerd Font
    position = 0, -130
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(e0e7e9cc)
    font_size = 16
    font_family = $font
    position = 0, -250
    halign = center
    valign = top
}
